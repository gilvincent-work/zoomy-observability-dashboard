name: PR notify (Google Chat)

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  notify:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Post to Google Chat
        env:
          WEBHOOK: ${{ secrets.GCHAT_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "GCHAT_WEBHOOK_URL not set (fork PR or missing secret); skipping"; exit 0; fi
          jq -n --arg t "🔀 *New PR* <$URL|$REPO#$NUM> $TITLE
          $AUTHOR · \`$HEAD\` → \`$BASE\`" '{text: $t}' \
            | curl -sS --fail-with-body -X POST -H "Content-Type: application/json; charset=UTF-8" -d @- "$WEBHOOK"
